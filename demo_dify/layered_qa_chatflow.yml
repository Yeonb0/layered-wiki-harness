app:
  description: 합성 시연 코퍼스 ( 차수 900 ) 볼트에서 보는 사람의 보기 안에 있는 노트만 근거로 답하고 [노트 id] 로 인용한다. 걸러 내기는 시연 API /search 가 서버에서 한다
  icon: 🔎
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 층 인식 인용 Q&A
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 보는 사람과 모드를 고른 뒤 질문하세요. 답은 그 보는 사람에게 보이는 노트만 근거로 하고, 문장 끝에 [노트 id] 를 붙입니다. 합성 시연 코퍼스이며 실제 회사 · 인물이 아닙니다
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: http-request
      id: e-start-search
      source: '1763300000001'
      sourceHandle: source
      target: '1763300000002'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: code
      id: e-search-parse
      source: '1763300000002'
      sourceHandle: source
      target: '1763300000003'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: code
        targetType: if-else
      id: e-parse-ifelse
      source: '1763300000003'
      sourceHandle: source
      target: '1763300000004'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: answer
      id: e-ifelse-fail
      source: '1763300000004'
      sourceHandle: 'true'
      target: '1763300000005'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: e-ifelse-llm
      source: '1763300000004'
      sourceHandle: 'false'
      target: '1763300000006'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: llm
        targetType: code
      id: e-llm-check
      source: '1763300000006'
      sourceHandle: source
      target: '1763300000007'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: code
        targetType: answer
      id: e-check-answer
      source: '1763300000007'
      sourceHandle: source
      target: '1763300000008'
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: 보는 사람 · 모드를 고른다 ( 시연용 선택이며 인증이 아니다 )
        selected: false
        title: 시작
        type: start
        variables:
        - label: 보는 사람
          max_length: 48
          options:
          - 개인:팀원A
          - 개인:팀원B
          - 개인:팀원C
          - 개인:팀원D
          - 개인:팀원E
          - 개인:팀원F
          - 팀:팀1
          - 팀:팀2
          - 전사
          required: true
          type: select
          variable: viewer
        - label: 모드
          max_length: 48
          options:
          - all_layers
          - split_by_layer
          required: true
          type: select
          variable: mode
      height: 116
      id: '1763300000001'
      position:
        x: 30
        y: 260
      positionAbsolute:
        x: 30
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: []
          type: none
        desc: 시연 API 가 보는 사람의 보기 안에서만 노트를 골라 준다 ( 서버 쪽 거르기 )
        headers: ''
        method: get
        params: 'mode:{{#1763300000001.mode#}}

          viewer:{{#1763300000001.viewer#}}

          q:{{#sys.query#}}

          k:4'
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 보기 안 검색
        type: http-request
        url: http://172.21.0.1:8090/search
        variables: []
      height: 135
      id: '1763300000002'
      position:
        x: 334
        y: 260
      positionAbsolute:
        x: 334
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\n\ndef main(body: str, status_code: int) -> dict:\n  # 시연 API 가 200 이 아니면 그 응답을 그대로 드러낸다\n  if status_code != 200:\n    return {\"context\": \"\", \"ids\": \"[]\", \"considered\": 0, \"error\": f\"검색 실패 ({status_code}) : {body[:300]}\"}\n  Obj = json.loads(body)\n  Ids = [Item[\"note_id\"] for Item in Obj[\"results\"]]\n  return {\"context\": Obj[\"context\"], \"ids\": json.dumps(Ids, ensure_ascii=False), \"considered\": Obj[\"considered\"], \"error\": \"\"}\n"
        code_language: python3
        desc: 검색 응답에서 context 와 노트 id 목록을 꺼낸다
        outputs:
          considered:
            children: null
            type: number
          context:
            children: null
            type: string
          error:
            children: null
            type: string
          ids:
            children: null
            type: string
        selected: false
        title: 검색 결과 풀기
        type: code
        variables:
        - value_selector:
          - '1763300000002'
          - body
          value_type: string
          variable: body
        - value_selector:
          - '1763300000002'
          - status_code
          value_type: number
          variable: status_code
      height: 54
      id: '1763300000003'
      position:
        x: 638
        y: 260
      positionAbsolute:
        x: 638
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: not empty
            id: cond-error
            value: ''
            varType: string
            variable_selector:
            - '1763300000003'
            - error
          id: 'true'
          logical_operator: and
        desc: 검색이 실패하면 모델을 부르지 않고 오류를 그대로 보인다
        selected: false
        title: 검색 실패?
        type: if-else
      height: 126
      id: '1763300000004'
      position:
        x: 942
        y: 260
      positionAbsolute:
        x: 942
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#1763300000003.error#}}'
        desc: ''
        selected: false
        title: 검색 실패
        type: answer
        variables: []
      height: 105
      id: '1763300000005'
      position:
        x: 1246
        y: 120
      positionAbsolute:
        x: 1246
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 검색된 노트 안에서만 답하고 [노트 id] 로 인용한다
        model:
          completion_params: {}
          mode: chat
          name: Qwen3-8B-Q4_K_M
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: prompt-system
          role: system
          text: "너는 가상 게임 스튜디오의 사내 노트만 근거로 답하는 도우미다.\n규칙\n1. 아래 <노트> 안의 내용만 근거로 쓴다. 노트에 없는 내용은 추측하지 않는다\n2. 근거가 없으면 \"주어진 노트에서 찾을 수 없습니다.\" 한 문장만 답한다\n3. 근거로 쓴 문장 끝에 그 노트의 id 를 대괄호로 적는다. 예 : … 이다 [노트 id]\n4. 대괄호 안에는 노트 id 만 쓴다\n5. 한국어로 짧게 답한다\n<노트>\n{{#1763300000003.context#}}\n</노트>"
        - id: prompt-user
          role: user
          text: '{{#sys.query#}} /no_think'
        reasoning_format: separated
        selected: false
        title: 근거 답변
        type: llm
        variables: []
        vision:
          enabled: false
      height: 90
      id: '1763300000006'
      position:
        x: 1246
        y: 320
      positionAbsolute:
        x: 1246
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\nimport re\n\n\ndef main(text: str, ids: str) -> dict:\n  # Qwen3 의 생각 블록이 남아 있으면 지운다\n  text = re.sub(r\"<think>.*?</think>\", \"\", text, flags=re.S).strip()\n  Allowed = json.loads(ids)\n  Cited = []\n  for Id in re.findall(r\"\\[([^\\[\\]]+)\\]\", text):\n    if Id not in Cited:\n      Cited.append(Id)\n  # 검색 결과에 있던 노트만 근거로 인정한다\n  Valid = [Id for Id in Cited if Id in Allowed]\n  Invalid = [Id for Id in Cited if Id not in Allowed]\n  Lines = [text, \"\", \"근거 노트 : \" + (\", \".join(Valid) if Valid else \"없음\")]\n  if Invalid:\n    Lines.append(\"검색 결과에 없는 인용 (무효) : \" + \", \".join(Invalid))\n  return {\"answer\": \"\\n\".join(Lines), \"valid_count\": len(Valid), \"invalid_count\": len(Invalid)}\n"
        code_language: python3
        desc: 인용한 id 가 검색 결과 안에 있는지 확인한다
        outputs:
          answer:
            children: null
            type: string
          invalid_count:
            children: null
            type: number
          valid_count:
            children: null
            type: number
        selected: false
        title: 인용 검사
        type: code
        variables:
        - value_selector:
          - '1763300000006'
          - text
          value_type: string
          variable: text
        - value_selector:
          - '1763300000003'
          - ids
          value_type: string
          variable: ids
      height: 54
      id: '1763300000007'
      position:
        x: 1550
        y: 320
      positionAbsolute:
        x: 1550
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#1763300000007.answer#}}'
        desc: ''
        selected: false
        title: 답변
        type: answer
        variables: []
      height: 105
      id: '1763300000008'
      position:
        x: 1854
        y: 320
      positionAbsolute:
        x: 1854
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
